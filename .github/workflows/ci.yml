name: CI

# Runs the harness's offline tests on every push and pull request. No engine is
# needed: the tests drive small python-chess stand-ins. What they do need is
# MateProver's independent proof checker, tools/verify_proof.py, which the
# certificate checks load from a MateProver checkout pinned to a release tag.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests / python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      MATEBENCH_MATEPROVER_REPO: ${{ github.workspace }}/mateprover
    steps:
      - uses: actions/checkout@v5

      - name: MateProver checkout (v0.3.0)
        uses: actions/checkout@v5
        with:
          repository: ScottMoore0/mateprover
          ref: v0.3.0
          path: mateprover

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install python-chess
        run: python -m pip install --upgrade "chess>=1.10"

      - name: Submission runner and certificate checks
        run: python bench/test_submit.py

      - name: Minimality and absence certificates
        run: python bench/test_certify.py

      - name: Measurement hook
        run: python bench/test_hook.py

      - name: Committed corpora match their recorded sha256
        run: |
          python - <<'EOF'
          import hashlib, json, subprocess, sys
          sums = json.load(open("corpora/CHECKSUMS.json", encoding="utf-8"))
          tracked = set(subprocess.run(["git", "ls-files", "corpora"], capture_output=True, text=True).stdout.split())
          bad = 0
          for name, entry in sorted(sums.items()):
              path = "corpora/" + entry["file"]
              if path not in tracked:
                  print("%-30s not committed (fetched locally)" % name)
                  continue
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              ok = digest == entry["sha256"]
              bad += not ok
              print("%-30s %s" % (name, "OK" if ok else "MISMATCH " + digest))
          sys.exit(1 if bad else 0)
          EOF
